apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-fbc-koncur-e2e-pipeline
spec:
  description: |
    Deploy MTA operator from FBC catalog to a leased OCPCTL pool cluster and run koncur hub E2E tests.
    Uses modular reusable tasks from migtools/mta-tackle2-ui .tekton/tasks/ for cluster lifecycle and operator deployment.

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON
      type: string
    - name: poolName
      description: Name of the cluster pool to lease from
      type: string
      default: "ci-sno-pool-1"
    - name: koncurBranch
      description: Branch of the konveyor/koncur repository to build and test from
      type: string
      default: "main"

  results:
    - name: IMAGE_VERIFICATION
      description: Pre-flight image pullability check status
      value: $(tasks.verify-image-pullable.results.verificationStatus)
    - name: LEASE_STATUS
      description: Pool cluster lease status
      value: $(tasks.lease-cluster.results.leaseStatus)
    - name: CLUSTER_NAME
      description: Name of the leased cluster
      value: $(tasks.lease-cluster.results.clusterName)
    - name: DEPLOYMENT_STATUS
      description: Operator deployment status
      value: $(tasks.deploy-operator.results.deploymentStatus)
    - name: TEST_OUTPUT
      description: Test execution result
      value: $(tasks.run-koncur-hub-tests.results.testStatus)

  tasks:
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: a1a70b0a1cfc96f5216d472fbd60f6b42780b3e5
          - name: pathInRepo
            value: tasks/test_metadata.yaml

    - name: verify-image-pullable
      runAfter:
        - parse-metadata
      params:
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/verify-image-pullable.yaml

    - name: lease-cluster
      runAfter:
        - verify-image-pullable
      params:
        - name: poolName
          value: $(params.poolName)
        - name: leaseDuration
          value: "4"
        - name: purpose
          value: "MTA FBC E2E Testing"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/ocpctl-pool-lease.yaml

    - name: cleanup-existing-mta
      runAfter:
        - lease-cluster
      params:
        - name: clusterId
          value: $(tasks.lease-cluster.results.clusterId)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/cleanup-mta.yaml

    - name: deploy-operator
      runAfter:
        - cleanup-existing-mta
      params:
        - name: clusterId
          value: $(tasks.lease-cluster.results.clusterId)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/deploy-mta-operator.yaml

    - name: run-koncur-hub-tests
      runAfter:
        - deploy-operator
      params:
        - name: uiRoute
          value: $(tasks.deploy-operator.results.uiRoute)
        - name: koncurBranch
          value: $(params.koncurBranch)
      taskSpec:
        params:
          - name: uiRoute
          - name: koncurBranch
        results:
          - name: testStatus
            description: Test execution status (PASSED or FAILED)
        stepTemplate:
          computeResources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 8Gi
              cpu: "4"
        steps:
          - name: run-tests
            image: golang:1.25
            env:
              - name: SKIP_MAVEN
                value: "false"
            script: |
              #!/bin/bash
              set -euo pipefail
              trap 'echo "FAILED" > $(results.testStatus.path)' ERR

              UI_ROUTE="$(params.uiRoute)"
              HUB_URL="https://${UI_ROUTE}/hub"

              echo "Tackle Hub URL: $HUB_URL"

              echo "Cloning koncur repository..."
              cd /tmp
              git clone --depth 1 --branch "$(params.koncurBranch)" https://github.com/konveyor/koncur.git
              cd koncur

              echo "Building koncur..."
              go build -o /usr/local/bin/koncur ./cmd/koncur/main.go

              echo "Writing maven settings (test artifacts served from koncur repo)..."
              mkdir -p .koncur/config
              cat > .koncur/config/settings.xml <<'EOF'
              <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
                <profiles>
                  <profile>
                    <id>konveyor-demo</id>
                    <repositories>
                      <repository>
                        <id>konveyor-demo</id>
                        <name>Konveyor demo test artifacts</name>
                        <url>https://raw.githubusercontent.com/konveyor/koncur/main/local-maven-resources</url>
                        <releases><enabled>true</enabled></releases>
                        <snapshots><enabled>true</enabled></snapshots>
                      </repository>
                    </repositories>
                  </profile>
                </profiles>
                <activeProfiles>
                  <activeProfile>konveyor-demo</activeProfile>
                </activeProfiles>
              </settings>
              EOF

              echo "Importing hub CA chain into the trust store..."
              # golang:1.25 is Debian-based, so use update-ca-certificates
              # (/usr/local/share/ca-certificates) rather than the RHEL
              # update-ca-trust path. Go's HTTP client reads the system store.
              openssl s_client -showcerts -connect "${UI_ROUTE}:443" </dev/null 2>/dev/null \
                | sed -n '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' \
                > /usr/local/share/ca-certificates/hub-chain.crt
              update-ca-certificates

              echo "Writing tackle-hub target config..."
              cat > .koncur/config/target-tackle-hub.yaml <<EOF
              type: tackle-hub
              tackleHub:
                url: ${HUB_URL}
                username: admin
                password: admin
                mavenSettings: ${PWD}/.koncur/config/settings.xml
              EOF

              echo "Running koncur hub tests..."
              if koncur run tests -t tackle-hub \
                --target-config .koncur/config/target-tackle-hub.yaml \
                -o yaml --output-file test-hub.yaml; then
                echo "PASSED" > $(results.testStatus.path)
              else
                echo "FAILED" > $(results.testStatus.path)
                exit 1
              fi

  finally:
    - name: release-cluster
      when:
        - input: "$(tasks.lease-cluster.status)"
          operator: in
          values: ["Succeeded"]
      params:
        - name: clusterId
          value: $(tasks.lease-cluster.results.clusterId)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-tackle2-ui
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/ocpctl-pool-release.yaml
